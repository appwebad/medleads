<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>MedLead Pernambuco</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div class="layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="logo">
        <h1>MedLead</h1>
        <span>Pernambuco</span>
      </div>

      <nav class="menu">
        <a href="#">Dashboard</a>
        <a href="#">Leads</a>
        <a href="#">CRM</a>
        <a href="#">Relatórios</a>
        <a href="#">Configurações</a>
      </nav>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <!-- HEADER -->
      <header class="header">

        <div>
          <h2>Dashboard CRM Médico</h2>
          <p>Captação Inteligente de Leads Médicos</p>
        </div>

        <button class="btn-primary" id="buscarLeads">
          Buscar Leads
        </button>

      </header>

      <!-- CARDS -->
      <section class="cards">

        <div class="card">
          <span>Total Leads</span>
          <h3>1245</h3>
        </div>

        <div class="card">
          <span>Novos</span>
          <h3>312</h3>
        </div>

        <div class="card">
          <span>Em Análise</span>
          <h3>94</h3>
        </div>

        <div class="card">
          <span>Fechados</span>
          <h3>52</h3>
        </div>

      </section>

      <!-- GRID -->
      <section class="content-grid">

        <!-- CHART -->
        <div class="box">

          <div class="box-header">
            <h3>Leads por Cidade</h3>
          </div>

          <canvas id="leadsChart"></canvas>

        </div>

        <!-- TABLE -->
        <div class="box">

          <div class="box-header">

            <h3>Leads Médicos</h3>

            <input type="text" id="searchInput" placeholder="Buscar lead..." />

          </div>

          <div class="table-container">

            <table>

              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Especialidade</th>
                  <th>Telefone</th>
                  <th>Cidade</th>
                  <th>Status</th>
                </tr>
              </thead>

              <tbody id="tableBody">
              </tbody>

            </table>

          </div>

        </div>

      </section>

    </main>

  </div>

  <script src="script.js"></script>

</body>

</html>
